<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏅 نجومي وإنجازاتي | القطة روفان</title>
<meta name="description" content="نجومك وشاراتك ومستواك في عالم القطة روفان — التقدم محفوظ على جهازك.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://rovan-the-cat.vercel.app/progress.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="siteHeader"></div>

<main id="main">
  <div class="page-hero">
    <span class="ph-icon" aria-hidden="true">🏅</span>
    <h1 data-i18n="progress.title">🏅 نجومي وإنجازاتي</h1>
    <p data-i18n="progress.sub">كل لعبة ودرس وقصة بتجيبلك نجوم وشارات — شوف تقدمك!</p>
  </div>

  <section id="progress">
    <div class="progress-panel">
      <div id="levelInfo" style="text-align:center; margin-bottom:22px;"></div>
      <div class="progress-stats" id="progressStats"></div>
      <div class="badges-grid" id="badgesGrid"></div>
      <p class="device-note" data-i18n="progress.deviceNote">📌 تقدمك محفوظ على الجهاز ده بس — لو فتحت من جهاز تاني هتبدأ من الأول.</p>
      <div style="text-align:center; margin-top:16px;">
        <button type="button" class="btn btn-white" id="resetProgress" data-i18n="progress.reset">🔄 إعادة تعيين التقدم</button>
      </div>
    </div>
  </section>

  <section id="settings">
    <div class="sec-head">
      <h2 data-i18n="settings.title">⚙️ إعدادات الصوت</h2>
      <p data-i18n="settings.sub">تحكم في صوت الكلام والمؤثرات — كل حاجة بتحفظ على جهازك</p>
    </div>
    <div id="settingsBox"></div>
  </section>
</main>

<div id="siteFooter"></div>

<button type="button" id="guideBtn" aria-label="مساعد روفان"><img src="images/avatar.jpg" alt=""></button>
<div id="guidePanel"><div class="guide-box" role="dialog" aria-label="مساعد روفان">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <b style="font-size:1.15rem;">🐱 Rovan</b>
    <button type="button" class="modal-close" id="guideClose" aria-label="إغلاق">✕</button>
  </div><div id="guideBody"></div>
</div></div>
<div id="confettiBox" aria-hidden="true"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/speech.js"></script>
<script src="js/games.js"></script>
<script src="js/academy.js"></script>
<script src="js/stories.js"></script>
<script src="js/main.js"></script>
</body>
</html>
