<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 أكاديمية Rovan | القطة روفان</title>
<meta name="description" content="أكاديمية القطة روفان: دروس تفاعلية بالصوت والصور — الحروف العربية والإنجليزية، الأرقام، الألوان، الحيوانات، الكلمات وتمارين الاستماع — مع اختبارات ونجوم.">
<link rel="canonical" href="https://rovan-the-cat.vercel.app/academy.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="siteHeader"></div>

<main id="main">
  <div class="page-hero">
    <span class="ph-icon" aria-hidden="true">🎓</span>
    <h1 data-i18n="academy.title">🎓 أكاديمية Rovan</h1>
    <p data-i18n="academy.sub">دروس تفاعلية بالصوت والصور — حروف وأرقام وألوان وحيوانات وكلمات!</p>
  </div>

  <section id="academy">
    <div class="quran-progress" style="background:linear-gradient(135deg, var(--purple), var(--sky));">
      <h3>🎓 <span data-i18n="academy.progress">تقدمك في الأكاديمية</span>: <b id="academyCount">0 / 8</b></h3>
      <div class="pbar" role="progressbar" aria-label="تقدم الأكاديمية"><div class="fill" id="academyProgress"></div></div>
    </div>
    <div class="games-grid" id="academyGrid"></div>
  </section>
</main>

<div id="siteFooter"></div>

<button type="button" id="guideBtn" aria-label="مساعد روفان"><img src="images/avatar.jpg" alt=""></button>
<div id="guidePanel"><div class="guide-box" role="dialog" aria-label="مساعد روفان">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <b style="font-size:1.15rem;">🐱 Rovan</b>
    <button type="button" class="modal-close" id="guideClose" aria-label="إغلاق">✕</button>
  </div><div id="guideBody"></div>
</div></div>

<div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-label="الدرس">
  <div class="modal-box light">
    <div class="modal-title">
      <span id="gameTitle">🎓</span>
      <button type="button" class="modal-close" aria-label="إغلاق">✕</button>
    </div>
    <div class="game-area">
      <div id="gameInstructions"></div>
      <div id="gameArea"></div>
    </div>
  </div>
</div>
<div id="confettiBox" aria-hidden="true"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/speech.js"></script>
<script src="js/games.js"></script>
<script src="js/academy.js"></script>
<script src="js/stories.js"></script>
<script src="js/hifz.js"></script>
<script src="js/main.js"></script>
</body>
</html>
