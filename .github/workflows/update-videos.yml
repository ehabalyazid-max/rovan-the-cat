# 🐱 تحديث فيديوهات القطة روفان تلقائيًا كل 6 ساعات
name: Update Rovan Videos

on:
  schedule:
    # كل 6 ساعات
    - cron: "0 */6 * * *"
  workflow_dispatch: # زرار يدوي للتجربة
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos from YouTube
        run: python scripts/update_videos.py

      - name: Commit & push if changed
        run: |
          git config user.name "rovan-bot"
          git config user.email "rovan-bot@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || git commit -m "🐱 تحديث الفيديوهات التلقائي"
          git push
